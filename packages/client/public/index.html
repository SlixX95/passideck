<!doctype html>
<html lang="de" style="color-scheme: dark;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020505">
  <title>PassiDeck</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css?v=20260612-wide-actions">
</head>
<body data-theme="green">
  <header class="topbar">
    <div class="command-strip">
      <div class="command-zone command-left">
        <span class="status-chip"><span class="dot"></span><span id="stat-active">0</span> Fenster · <span id="saveState">saved</span></span>
        <nav class="launch-strip" aria-label="Schnellstart">
          <button class="topbar-ql-btn" data-command="/bin/bash" data-tooltip="Shell öffnen" aria-label="Shell öffnen">+ shell</button>
          <button class="topbar-ql-btn" data-command="hermes" data-tooltip="Hermes CLI öffnen" aria-label="Hermes CLI öffnen">+ hermes</button>
          <button class="topbar-ql-btn" data-command="hermes --tui" data-tooltip="Hermes TUI öffnen" aria-label="Hermes TUI öffnen">+ tui</button>
          <button class="topbar-ql-btn" data-command="codex" data-tooltip="Codex CLI öffnen" aria-label="Codex CLI öffnen">+ codex</button>
        </nav>
      </div>

      <div class="command-zone command-center" aria-label="Fensterauswahl">
        <div class="switcher-grid" id="switcherGrid"></div>
      </div>

      <div class="command-zone command-right">
        <nav class="layout-pack" aria-label="Layout">
          <div id="gridPickerInline" class="grid-picker-inline"></div>
        </nav>
        <section id="systemMonitor" class="system-monitor" hidden aria-label="System monitor">
          <span class="monitor-cell" data-metric="cpu"><span>CPU</span><b>0%</b></span>
          <span class="monitor-cell" data-metric="ram"><span>RAM</span><b>0%</b></span>
          <span class="monitor-cell" data-metric="disk" aria-label="Disk"><span>DSK</span><b>--%</b></span>
        </section>
        <section id="codexLimits" class="codex-limits" aria-label="Codex limits">
          <span class="codex-limit" data-limit="primary" data-tooltip="Codex 5h" aria-label="Codex 5h"><span>5h</span><b>--%</b></span>
          <span class="codex-limit" data-limit="secondary" data-tooltip="Codex weekly" aria-label="Codex weekly"><span>W</span><b>--%</b></span>
        </section>
        <span class="command-divider"></span>
        <button id="settingsToggle" class="chrome-btn" data-tooltip="Settings" aria-label="Settings" aria-expanded="false">⚙ settings</button>
        <button id="uploadFileBtn" class="chrome-btn" data-tooltip="Datei hochladen · Pfad in aktive Shell einfügen" aria-label="Datei hochladen">⇧ upload</button>
        <button id="clipboardImageBtn" class="chrome-btn" data-tooltip="Clipboard-Bild hochladen · Pfad in aktive Shell einfügen" aria-label="Clipboard-Bild hochladen">▧ clip img</button>
        <button id="chromeToggle" class="chrome-btn" data-tooltip="UI ausblenden · Alt+0" aria-label="UI ausblenden">hide</button>
        <input id="fileInput" type="file" hidden>
      </div>
    </div>
  </header>

  <button id="chromePeek" class="chrome-peek" data-tooltip="UI anzeigen · Alt+0" aria-label="UI anzeigen">ui</button>

  <section id="settingsPanel" class="settings-panel" role="dialog" aria-label="Settings" hidden>
    <div class="settings-title">⚙ settings</div>
    <label for="themeSelect">Theme</label>
    <select id="themeSelect">
      <option value="blue">Blue</option>
      <option value="green">Green</option>
      <option value="emerald">Emerald</option>
      <option value="cyan">Cyan</option>
      <option value="amber">Amber</option>
      <option value="purple">Purple</option>
      <option value="red">Red</option>
      <option value="mono">Mono</option>
    </select>
    <label for="skinSelect">Chrome</label>
    <select id="skinSelect">
      <option value="neon">Neon glass</option>
      <option value="stealth">Stealth</option>
      <option value="prism">Prism edge</option>
    </select>
    <label for="fontSizeSlider">Font</label>
    <input type="range" id="fontSizeSlider" name="fontSize" min="10" max="24" value="13" step="1" data-tooltip="Terminal Font-Size" aria-label="Terminal Font-Size">
    <span id="fontSizeLabel" class="font-size-label">13px</span>
    <label class="monitor-toggle" for="systemMonitorToggle">
      <input id="systemMonitorToggle" type="checkbox">
      <span>Monitor oben anzeigen</span>
    </label>
  </section>

  <main class="grid-container layout-auto" id="termGrid">
    <section class="empty-state" id="emptyState">
      <svg width="64" height="64" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x="4" y="4" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
        <rect x="26" y="4" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
        <rect x="4" y="26" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
        <rect x="26" y="26" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <h2>Keine Fenster offen.</h2>
      <p>Shell, Hermes TUI oder Codex öffnen.</p>
      <div class="quick-launch-group">
        <button class="quick-launch-btn" data-command="/bin/bash"><span class="ql-cmd">shell</span><span class="ql-desc">Open a shell</span></button>
        <button class="quick-launch-btn" data-command="hermes"><span class="ql-cmd">hermes</span><span class="ql-desc">Open Hermes CLI</span></button>
        <button class="quick-launch-btn" data-command="hermes --tui"><span class="ql-cmd">hermes --tui</span><span class="ql-desc">Open Hermes TUI</span></button>
        <button class="quick-launch-btn" data-command="codex"><span class="ql-cmd">codex</span><span class="ql-desc">Open Codex CLI</span></button>
      </div>
    </section>
  </main>
  <div id="hiddenPanes" style="display:none"></div>

  <section class="minimized-bar" id="minimizedBar" hidden>
    <div class="minimized-tabs" id="minimizedTabs"></div>
  </section>

  <div id="closeModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="closeModalTitle" hidden>
    <div class="modal-box">
      <h3 id="closeModalTitle" class="modal-title"></h3>
      <p class="modal-text">Prozess wird beendet.</p>
      <div class="modal-actions">
        <button id="closeModalCancel" class="modal-btn modal-btn-cancel">Abbrechen</button>
        <button id="closeModalConfirm" class="modal-btn modal-btn-confirm">Schließen</button>
      </div>
    </div>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-web-links.js"></script>
  <script src="vendor/addon-serialize.js"></script>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js?v=20260622-copy-shortcut" defer></script>
</body>
</html>
