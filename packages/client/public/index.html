<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PassiDeck</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">PassiDeck</div>
    <nav class="layouts" aria-label="Layout">
      <button data-layout="1x1">1x1</button>
      <button data-layout="2x1">2x1</button>
      <button data-layout="2x2">2x2</button>
      <button data-layout="3x2">3x2</button>
      <button data-layout="2x4">2x4</button>
      <button data-layout="4x2">4x2</button>
    </nav>
    <nav class="quick" aria-label="Quick launch">
      <button data-command="/bin/bash">shell</button>
      <button data-command="hermes">hermes</button>
      <button data-command="codex">codex</button>
    </nav>
  </header>

  <main id="termGrid" class="grid layout-2x1">
    <section id="emptyState" class="empty">
      <h1>Keine Terminals.</h1>
      <p>shell, hermes oder codex öffnen.</p>
    </section>
  </main>

  <footer class="promptbar">
    <input id="promptInput" placeholder="command…" autocomplete="off" spellcheck="false">
    <button id="promptLaunch">launch</button>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
