<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PassiDeck</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <link rel="stylesheet" href="style.css?v=20260427-absolute-actions">
</head>
<body data-theme="blue">
  <header class="topbar">
    <div class="topbar-row topbar-row-1">
      <div class="topbar-left">
        <div class="topbar-logo">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <rect x="1" y="1" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
            <rect x="10" y="1" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
            <rect x="1" y="10" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
            <rect x="10" y="10" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
          </svg>
        </div>
        <div class="topbar-stats">
          <span class="topbar-stat"><span class="dot"></span><span id="stat-active">0</span> Fenster</span>
        </div>
      </div>

      <nav class="topbar-center layouts" aria-label="Layout">
        <div id="gridPickerInline" class="grid-picker-inline"></div>
      </nav>
    </div>

    <div class="topbar-row topbar-row-2">
      <div class="term-switcher" aria-label="Fensterauswahl">
        <div class="term-switcher-label">Alt+1…9</div>
        <div class="switcher-grid" id="switcherGrid"></div>
      </div>

      <nav class="topbar-ql" aria-label="Schnellstart">
        <button class="topbar-ql-btn" data-command="/bin/bash" title="Open a bash shell">shell</button>
        <button class="topbar-ql-btn" data-command="hermes" title="Open Hermes CLI, then return to shell after Ctrl-C/exit">hermes</button>
        <button class="topbar-ql-btn" data-command="codex" title="Open Codex CLI, then return to shell after Ctrl-C/exit">codex</button>
      </nav>

      <button id="settingsToggle" class="chrome-btn" title="Settings">settings</button>
      <button id="chromeToggle" class="chrome-btn" title="UI ausblenden · Alt+0">hide ui</button>
      <button id="uploadFileBtn" class="chrome-btn" title="Datei hochladen; Bilder in Hermes als Attachment anhängen">upload</button>
      <button id="clipboardImageBtn" class="chrome-btn" title="Clipboard-Bild hochladen; in Hermes als Attachment anhängen">clipboard image</button>
      <input id="fileInput" type="file" hidden>
      <div class="topbar-row-2-spacer"></div>
    </div>
  </header>

  <button id="chromePeek" class="chrome-peek" title="UI anzeigen · Alt+0">ui</button>

  <section id="settingsPanel" class="settings-panel" hidden>
    <label for="themeSelect">Theme</label>
    <select id="themeSelect">
      <option value="blue">Blue</option>
      <option value="green">Green</option>
      <option value="amber">Amber</option>
      <option value="purple">Purple</option>
      <option value="red">Red</option>
      <option value="mono">Mono</option>
    </select>
    <label for="fontSizeSlider">Font</label>
    <input type="range" id="fontSizeSlider" min="10" max="24" value="13" step="1" title="Terminal Font-Size">
    <span id="fontSizeLabel" class="font-size-label">13px</span>
  </section>

  <main class="grid-container layout-2x1" id="termGrid">
    <section class="empty-state" id="emptyState">
      <svg width="64" height="64" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x="4" y="4" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
        <rect x="26" y="4" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
        <rect x="4" y="26" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
        <rect x="26" y="26" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <h2>No terminals yet.</h2>
      <p>shell, hermes oder codex öffnen.</p>
      <div class="quick-launch-group">
        <button class="quick-launch-btn" data-command="/bin/bash"><span class="ql-cmd">shell</span><span class="ql-desc">Open a shell</span></button>
        <button class="quick-launch-btn" data-command="hermes"><span class="ql-cmd">hermes</span><span class="ql-desc">Open Hermes CLI</span></button>
        <button class="quick-launch-btn" data-command="codex"><span class="ql-cmd">codex</span><span class="ql-desc">Open Codex CLI</span></button>
      </div>
    </section>
  </main>
  <div id="hiddenPanes" style="display:none"></div>

  <section class="minimized-bar" id="minimizedBar" hidden>
    <div class="minimized-tabs" id="minimizedTabs"></div>
  </div>

  <!-- Close Confirmation Modal -->
  <div id="closeModal" class="modal-overlay" hidden>
    <div class="modal-box">
      <h3 id="closeModalTitle" class="modal-title"></h3>
      <p class="modal-text">Prozess wird beendet.</p>
      <div class="modal-actions">
        <button id="closeModalCancel" class="modal-btn modal-btn-cancel">Abbrechen</button>
        <button id="closeModalConfirm" class="modal-btn modal-btn-confirm">Schließen</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
  <script src="addon-serialize.min.js?v=20260426" defer></script>
  <script src="app.js?v=20260427-close-hit-layer" defer></script>
</body>
</html>
